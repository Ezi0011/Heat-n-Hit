<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mobile Controller</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <div id="playerInfo">Connexion...</div>

  <div id="nameDialog" class="name-dialog">
    <h2>Entrez votre nom</h2>
    <input type="text" id="playerName" placeholder="Votre nom" maxlength="20" />
    <button id="nameBtn" class="name-btn">Commencer</button>
  </div>

  <div class="controler" id="gameControls" style="display: none;">
    <div class="dpad">
      <div class="diamond"></div>

      <button class="dir up" data-direction="up">▲</button>
      <button class="dir left" data-direction="left">◀</button>
      <button class="dir right" data-direction="right">▶</button>
      <button class="dir down" data-direction="down">▼</button>
    </div>

    <button class="shoot" id="shootBtn">SHOOT</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./controleur.js"></script>

</body>
</html>
