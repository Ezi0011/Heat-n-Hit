<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Controller</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="controler">
    <div class="dpad">
      <div class="diamond"></div>

      <button class="dir up" data-direction="up">▲</button>
      <button class="dir left" data-direction="left">◀</button>
      <button class="dir right" data-direction="right">▶</button>
      <button class="dir down" data-direction="down">▼</button>
    </div>

    <button class="shoot" id="shootBtn">Bomb</button>
  </div>

   <div id="status">Connexion...</div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="./controleur.js"></script>
</body>
</html>
